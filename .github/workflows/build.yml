name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KS_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare signing key
        run: |
          if [ -z "$KS_B64" ]; then echo "KS_B64 secret missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/uth.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/uth.p12" >> "$GITHUB_ENV"
      - name: Make Android project
        run: bash patch.sh
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Uthotehobe v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
